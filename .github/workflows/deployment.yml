name: Snowflake SchemaChange Deployment

on:
  push:
    branches:
      - dev
      - uat
      - prod
  workflow_dispatch:

jobs:
  # 1. Generate Matrix (always runs)
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml schemachange

      - name: Generate matrix
        id: set-matrix
        run: |
          controllers=$(python config/get_controller.py)
          echo "matrix={\"schema\": $controllers}" >> $GITHUB_OUTPUT

  # 2. Extract DDL (runs after matrix, fails fast on error)
  extract-ddl:
    needs: build-matrix
    runs-on: ubuntu-latest
    environment: >-
      ${{ 
        github.ref_name == 'dev' && 'sf_dev_env_cred' || 
        github.ref_name == 'uat' && 'sf_test_env_cred' || 
        github.ref_name == 'prod' && 'sf_prod_env_cred' 
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python cryptography pandas

      - name: Create private key file
        run: |
          echo "${{ secrets.SF_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Run DDL extraction
        env:
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
        run: python config/extract_ddl.py

      - name: Commit and push new migrations
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto-generated migrations from CONFIG_SNOWFLAKE_CICD [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Cleanup private key
        if: always()
        run: rm -f private_key.pem

  # 3. Deploy (only if previous succeeded, skip on [skip ci])
  deploy-schema:
    needs: extract-ddl
    if: success() && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    environment: >-
      ${{ 
        github.ref_name == 'dev' && 'sf_dev_env_cred' || 
        github.ref_name == 'uat' && 'sf_test_env_cred' || 
        github.ref_name == 'prod' && 'sf_prod_env_cred' 
      }}
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
      max-parallel: 3
      fail-fast: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Generate variables JSON
        run: |
          python config/get_vars.py ${{ matrix.schema }}/migrations/${{ matrix.schema }}-var.yml > schema_vars.json
          echo "=== Variables for ${{ matrix.schema }} ==="
          cat schema_vars.json

      - name: Create private key file
        run: |
          echo "${{ secrets.SF_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy ${{ matrix.schema }} schema
        env:
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SCHEMA: ${{ matrix.schema }}
        run: |
          VARS_CONTENT=$(cat schema_vars.json | jq -c .)
          schemachange deploy \
            --config-folder ${{ matrix.schema }}/migrations/config \
            --snowflake-account ${{ secrets.SF_ACCOUNT }} \
            --snowflake-user ${{ secrets.SF_USERNAME }} \
            --snowflake-role ${{ secrets.SF_ROLE }} \
            --snowflake-warehouse ${{ secrets.SF_WAREHOUSE }} \
            --snowflake-authenticator snowflake_jwt \
            --snowflake-private-key-path private_key.pem \
            --vars "$VARS_CONTENT" \
            --verbose
