name: Snowflake SchemaChange + DDL Extraction

on:
  push:
    branches:
      - dev
      - uat
      - prod
  workflow_dispatch:
    inputs:
      extract_ddl:
        description: 'Force run DDL extraction?'
        type: boolean
        default: true
        required: false

jobs:
  # --------------------------------------------------------------
  # 1. DDL Extraction Job – runs on EVERY push + manual
  # --------------------------------------------------------------
  extract-ddl:
    runs-on: ubuntu-latest
    environment: >-
      ${{ 
        github.ref_name == 'dev' && 'sf_dev_env_cred' || 
        github.ref_name == 'uat' && 'sf_test_env_cred' || 
        github.ref_name == 'prod' && 'sf_prod_env_cred' 
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python[cryptography] pandas pyyaml

      - name: Create private key file
        run: |
          echo "${{ secrets.SF_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Extract DDL from CONFIG_SNOWFLAKE_CICD
        id: extract
        env:
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
        run: |
          echo "Running DDL extraction from CONFIG_SNOWFLAKE_CICD table..."
          python config/extract_ddl.py | tee extraction.log
          cat extraction.log

      - name: Show what was created (if any)
        if: steps.extract.outcome == 'success'
        run: |
          echo "=== Files created by extraction ==="
          git status --porcelain | grep -E '\.sql$' || echo "No new migration files created"
          echo "=== Preview of new migration files ==="
          find . -name "V*__RELEASE_*.sql" -type f -newer extraction.log -print -exec cat {} \; || echo "No new files"

      - name: Commit & push new migration files (skip CI loop)
        if: steps.extract.outcome == 'success'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto-generated migrations from CONFIG_SNOWFLAKE_CICD [skip ci]" || echo "Nothing to commit"
          git push origin ${{ github.ref_name }} || echo "Nothing to push"

      - name: Cleanup private key
        if: always()
        run: rm -f private_key.pem extraction.log

  # --------------------------------------------------------------
  # 2. Normal SchemaChange Deployment – runs ONLY if commit message does NOT contain [skip ci]
  # --------------------------------------------------------------
  build-matrix:
    needs: extract-ddl
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository (fresh after extraction)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml schemachange

      - name: Generate deployment matrix
        id: set-matrix
        run: |
          controllers=$(python config/get_controller.py)
          echo "matrix={\"schema\": $controllers}" >> $GITHUB_OUTPUT

  deploy-schema:
    needs: [extract-ddl, build-matrix]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    environment: >-
      ${{ 
        github.ref_name == 'dev' && 'sf_dev_env_cred' || 
        github.ref_name == 'uat' && 'sf_test_env_cred' || 
        github.ref_name == 'prod' && 'sf_prod_env_cred' 
      }}
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
      max-parallel: 5
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Generate variables JSON
        run: |
          python config/get_vars.py ${{ matrix.schema }}/migrations/${{ matrix.schema }}-var.yml > schema_vars.json
          echo "=== Variables for ${{ matrix.schema }} ==="
          cat schema_vars.json

      - name: Create private key file
        run: |
          echo "${{ secrets.SF_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy ${{ matrix.schema }} schema
        env:
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SCHEMA: ${{ matrix.schema }}
        run: |
          VARS_CONTENT=$(cat schema_vars.json | jq -c .)
          schemachange deploy \
            --config-folder ${{ matrix.schema }}/migrations/config \
            --snowflake-account ${{ secrets.SF_ACCOUNT }} \
            --snowflake-user ${{ secrets.SF_USERNAME }} \
            --snowflake-role ${{ secrets.SF_ROLE }} \
            --snowflake-warehouse ${{ secrets.SF_WAREHOUSE }} \
            --snowflake-authenticator snowflake_jwt \
            --snowflake-private-key-path private_key.pem \
            --vars "$VARS_CONTENT" \
            --verbose

